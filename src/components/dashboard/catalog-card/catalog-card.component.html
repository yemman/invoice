<div class="bg-white rounded-xl shadow-md border border-slate-200 flex flex-col overflow-hidden">
  <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-gradient-to-r from-blue-50 to-white">
    <div>
      <h3 class="font-bold text-slate-800 text-lg">Catalog</h3>
      <p class="text-sm text-slate-500">{{ catalogService.totalItems() }} products available</p>
    </div>
    <div class="p-2 bg-blue-100 text-blue-600 rounded-lg">
      <i class="fa-solid fa-boxes w-6 h-6" aria-hidden="true"></i>
    </div>
  </div>
  <div class="flex flex-col gap-4 p-6 grow justify-between">
    <div class="space-y-3">
      <div class="flex items-center justify-between p-3 bg-blue-50 rounded-lg">
        <span class="text-sm font-medium text-slate-700">Total Items</span>
        <span class="text-2xl font-bold text-blue-600">{{ catalogService.totalItems() }}</span>
      </div>
      <div class="text-xs text-slate-500 space-y-1">
        <p>✓ Manage product index and pricing</p>
        <p>✓ Organize by category</p>
        <p>✓ Track inventory</p>
      </div>
    </div>
    <button 
      (click)="openManage()"
      class="w-full px-4 py-2.5 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-lg hover:from-blue-600 hover:to-blue-700 font-medium transition-all duration-200 flex items-center justify-center gap-2"
    >
      <i class="fa-solid fa-gear w-4 h-4" aria-hidden="true"></i>
      Manage Catalog
    </button>
  </div>
</div>

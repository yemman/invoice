<app-validation-summary [errors]="showValidationSummary() ? formErrors() : []"></app-validation-summary>

<div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden flex flex-col h-full">
  <div class="bg-indigo-600 p-4 flex justify-between items-center text-white shrink-0">
      <h2 class="text-lg font-bold flex items-center gap-2">
      <i class="fa-solid fa-circle-check w-6 h-6" aria-hidden="true"></i>
      Verify Extraction
    </h2>
    <span class="text-xs bg-white/20 px-2 py-1 rounded">AI Confidence: High</span>
  </div>

  <div class="flex flex-col h-full">
    <div class="p-6 overflow-y-auto grow">
      <!-- Header Info -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="space-y-1">
          <label class="text-xs font-medium text-slate-500 uppercase">Customer Name</label>
          <input type="text" [(ngModel)]="editableData().customer_name" name="customerName" list="customer-list"
                 class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all font-semibold text-slate-800">
          <datalist id="customer-list">
            @for (customer of customers(); track customer) {
              <option [value]="customer"></option>
            }
          </datalist>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-medium text-slate-500 uppercase">Invoice Date</label>
          <input type="date" [formControl]="dateControl()" (change)="editableData().invoice_date = dateControl().value" name="invoiceDate"
                 class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all"
                 [class.border-red-500]="dateControl().touched && dateControl().invalid">
          <app-validation-message [control]="dateControl()"></app-validation-message>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-medium text-slate-500 uppercase">Invoice #</label>
          <input type="text" [(ngModel)]="editableData().invoice_number" name="invoiceNumber"
                 class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
        </div>
      </div>

      <!-- Items Table -->
      <div class="border rounded-lg overflow-hidden mb-6">
        <table class="w-full text-sm text-left">
          <thead class="bg-slate-100 text-slate-600 font-semibold">
            <tr>
              <th class="px-4 py-3">Item Description</th>
              <th class="px-4 py-3 w-24">Catalog #</th>
              <th class="px-4 py-3 w-24">Qty</th>
              <th class="px-4 py-3 w-32">Unit Price</th>
              <th class="px-4 py-3 w-32 text-right">Total</th>
              <th class="px-2 py-3 w-10"></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-200">
            @for (item of editableData().items; track $index) {
              <tr class="group hover:bg-slate-50 transition-colors">
                <td class="px-4 py-2">
                  <input type="text" [(ngModel)]="item.name" name="itemName-{{$index}}"
                         class="w-full bg-transparent border-none focus:ring-0 p-0 font-medium text-slate-700 placeholder-slate-400" placeholder="Item name">
                </td>
                <td class="px-4 py-2">
                  <input type="number" [(ngModel)]="item.catalogIndex" (change)="onCatalogIndexChange(item)" name="itemCatalog-{{$index}}"
                         class="w-full bg-transparent border-none focus:ring-0 p-0 text-slate-600" placeholder="#">
                </td>
                <td class="px-4 py-2">
                  <input type="number" [(ngModel)]="item.quantity" (change)="recalcItem(item)" name="itemQuantity-{{$index}}"
                         class="w-full bg-transparent border-none focus:ring-0 p-0 text-slate-600">
                </td>
                <td class="px-4 py-2">
                  <div class="flex items-center">
                    <span class="text-slate-400 mr-1">₪</span>
                    <input type="number" [(ngModel)]="item.unit_price" (change)="recalcItem(item)" name="itemPrice-{{$index}}"
                           class="w-full bg-transparent border-none focus:ring-0 p-0 text-slate-600">
                  </div>
                </td>
                <td class="px-4 py-2 text-right font-mono text-slate-800">
                  {{ item.total_price | currency:'ILS' }}
                </td>
                <td class="px-2 py-2 text-center opacity-0 group-hover:opacity-100 transition-opacity">
                  <button type="button" (click)="removeItem($index)" class="text-red-400 hover:text-red-600">
                    <i class="fa-solid fa-xmark w-5 h-5" aria-hidden="true"></i>
                  </button>
                </td>
              </tr>
            }
            
            <!-- Add Item Row -->
            <tr>
              <td colspan="6" class="px-4 py-2 bg-slate-50">
                <button type="button" (click)="addItem()" class="text-indigo-600 text-sm font-medium hover:underline flex items-center gap-1">
                  <i class="fa-solid fa-plus w-4 h-4" aria-hidden="true"></i>
                  Add Item
                </button>
              </td>
            </tr>
          </tbody>
          <tfoot class="bg-slate-100 font-bold text-slate-700">
            <tr [class.bg-red-100]="amountControl().touched && amountControl().invalid">
              <td colspan="3" class="px-4 py-3 text-right">Invoice Total:</td>
              <td class="px-4 py-3 text-right text-indigo-700 text-lg">
                {{ calculateTotal() | currency:'ILS' }}
                <app-validation-message [control]="amountControl()"></app-validation-message>
              </td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-end gap-3 shrink-0">
      <button type="button" (click)="onCancel.emit()" class="px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-200 font-medium transition-colors">
        Discard
      </button>
      <button type="button" (click)="handleConfirm()" class="px-6 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-md transition-all flex items-center gap-2">
        <i class="fa-solid fa-check w-5 h-5" aria-hidden="true"></i>
        Confirm & Save
      </button>
    </div>
  </div>
</div>

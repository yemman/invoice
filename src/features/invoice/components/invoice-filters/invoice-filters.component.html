<div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
  <!-- Header with toggle and badge -->
  <div class="p-4 bg-gradient-to-r from-slate-50 to-slate-100 border-b border-slate-200 flex items-center justify-between cursor-pointer hover:from-slate-100 hover:to-slate-150 transition-colors" [class.rounded-b-lg]="!isExpanded" (click)="onToggleExpand()">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-sliders text-slate-600"></i>
      <h3 class="font-semibold text-slate-700">Advanced Filters</h3>
      @if (activeFilterCount > 0) {
        <span class="inline-flex items-center justify-center w-6 h-6 bg-emerald-500 text-white text-xs font-bold rounded-full">
          {{ activeFilterCount }}
        </span>
      }
    </div>
    <button type="button" class="p-1 rounded hover:bg-slate-200 transition-colors" [class.rotate-180]="isExpanded">
      <i class="fa-solid fa-chevron-down text-slate-600"></i>
    </button>
  </div>

  <!-- Collapsible filters section -->
  @if (isExpanded) {
    <div class="p-4 space-y-4">
      <!-- Search Term -->
      <div class="space-y-2">
        <label for="searchTerm" class="block text-sm font-medium text-slate-700">
          <i class="fa-solid fa-magnifying-glass mr-2"></i>Search
        </label>
        <input
          #searchInput
          id="searchTerm"
          type="text"
          [value]="filters.searchTerm"
          (input)="onSearchTermChange(searchInput.value)"
          placeholder="Invoice #, Customer, Item name..."
          class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-colors"
          aria-label="Search invoices by invoice number, customer name, or item"
        />
        <p class="text-xs text-slate-500">Search across invoice number, customer, and item names</p>
      </div>

      <!-- Status Filter -->
      <div class="space-y-2">
        <label for="status" class="block text-sm font-medium text-slate-700">
          <i class="fa-solid fa-circle-check mr-2"></i>Status
        </label>
        <select
          #statusSelect
          id="status"
          [value]="filters.status"
          (change)="onStatusChange(statusSelect.value)"
          class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-colors"
          aria-label="Filter by invoice status"
        >
          <option value="all">All Statuses</option>
          <option value="verified">✓ Verified</option>
          <option value="draft">📝 Draft</option>
        </select>
      </div>

      <!-- Customer Filter -->
      <div class="space-y-2">
        <label for="customerName" class="block text-sm font-medium text-slate-700">
          <i class="fa-solid fa-user mr-2"></i>Customer Name
        </label>
        <input
          #customerInput
          id="customerName"
          type="text"
          [value]="filters.customerName"
          (input)="onCustomerChange(customerInput.value)"
          placeholder="Filter by customer..."
          class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-colors"
          aria-label="Filter by customer name"
        />
      </div>

      <!-- Date Range -->
      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-2">
          <label for="dateFrom" class="block text-sm font-medium text-slate-700">
            <i class="fa-solid fa-calendar mr-1"></i>From Date
          </label>
          <input
            #dateFromInput
            id="dateFrom"
            type="date"
            [value]="filters.dateFrom"
            (change)="onDateFromChange(dateFromInput.value)"
            class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-colors"
            aria-label="Filter from date"
          />
        </div>
        <div class="space-y-2">
          <label for="dateTo" class="block text-sm font-medium text-slate-700">
            <i class="fa-solid fa-calendar mr-1"></i>To Date
          </label>
          <input
            #dateToInput
            id="dateTo"
            type="date"
            [value]="filters.dateTo"
            (change)="onDateToChange(dateToInput.value)"
            class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-colors"
            aria-label="Filter to date"
          />
        </div>
      </div>

      <!-- Amount Range -->
      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-2">
          <label for="minAmount" class="block text-sm font-medium text-slate-700">
            <i class="fa-solid fa-shekel-sign mr-1"></i>Min Amount
          </label>
          <input
            #minAmountInput
            id="minAmount"
            type="number"
            [value]="formatNumber(filters.minAmount)"
            (input)="onMinAmountChange(minAmountInput.value)"
            placeholder="0"
            min="0"
            step="100"
            class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-colors"
            aria-label="Filter by minimum amount"
          />
        </div>
        <div class="space-y-2">
          <label for="maxAmount" class="block text-sm font-medium text-slate-700">
            <i class="fa-solid fa-shekel-sign mr-1"></i>Max Amount
          </label>
          <input
            #maxAmountInput
            id="maxAmount"
            type="number"
            [value]="formatNumber(filters.maxAmount)"
            (input)="onMaxAmountChange(maxAmountInput.value)"
            placeholder="No limit"
            min="0"
            step="100"
            class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-colors"
            aria-label="Filter by maximum amount"
          />
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="pt-4 border-t border-slate-200 flex gap-2">
        <button
          type="button"
          (click)="onResetFilters()"
          class="flex-1 px-4 py-2 bg-slate-100 text-slate-700 rounded-md hover:bg-slate-200 transition-colors font-medium text-sm flex items-center justify-center gap-2"
          aria-label="Reset all filters"
        >
          <i class="fa-solid fa-rotate-left"></i>Reset
        </button>
        <button
          type="button"
          (click)="onToggleExpand()"
          class="flex-1 px-4 py-2 bg-emerald-500 text-white rounded-md hover:bg-emerald-600 transition-colors font-medium text-sm flex items-center justify-center gap-2"
          aria-label="Close filters panel"
        >
          <i class="fa-solid fa-check"></i>Done
        </button>
      </div>
    </div>
  }
</div>

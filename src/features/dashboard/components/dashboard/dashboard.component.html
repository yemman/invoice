@if (!showCatalogManagement()) {
  <div class="w-full h-full flex flex-col gap-3 md:gap-6">
    <!-- View Tabs -->
    <div class="flex gap-2 border-b border-slate-200">
      <button
        type="button"
        (click)="switchView('overview')"
        [class.border-b-2]="activeView() === 'overview'"
        [class.border-emerald-500]="activeView() === 'overview'"
        [class.text-emerald-600]="activeView() === 'overview'"
        [class.font-semibold]="activeView() === 'overview'"
        [class.text-slate-500]="activeView() !== 'overview'"
        class="px-4 py-3 transition-colors hover:text-slate-700"
        [attr.aria-selected]="activeView() === 'overview'"
      >
        <i class="fa-solid fa-chart-column mr-2"></i>Dashboard Overview
      </button>
      <button
        type="button"
        (click)="switchView('search')"
        [class.border-b-2]="activeView() === 'search'"
        [class.border-emerald-500]="activeView() === 'search'"
        [class.text-emerald-600]="activeView() === 'search'"
        [class.font-semibold]="activeView() === 'search'"
        [class.text-slate-500]="activeView() !== 'search'"
        class="px-4 py-3 transition-colors hover:text-slate-700"
        [attr.aria-selected]="activeView() === 'search'"
      >
        <i class="fa-solid fa-magnifying-glass mr-2"></i>Advanced Search
      </button>
    </div>

    <!-- Overview View -->
    @if (activeView() === 'overview') {
      <div class="flex-1 overflow-auto space-y-3 md:space-y-6">
        <!-- Cards Grid - Responsive -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-6">
          <app-inventory-sold-card></app-inventory-sold-card>
          <app-accounts-receivable-card (selectCustomer)="selectCustomer($event)"></app-accounts-receivable-card>
          <app-catalog-card (manage)="toggleCatalogManagement()"></app-catalog-card>
        </div>
        
        <app-customer-invoices
          [customerName]="selectedCustomer()"
          [invoices]="customerInvoices()"
          (close)="clearSelection()"
          (edit)="onEditInvoice($event)"
          (remove)="onDeleteInvoice($event)"
        ></app-customer-invoices>
      </div>
    }

    <!-- Search View -->
    @if (activeView() === 'search') {
      <div class="flex-1 overflow-auto">
        <app-invoice-search
          [invoices]="invoiceService.invoices()"
          (edit)="onEditInvoice($event)"
          (remove)="onDeleteInvoice($event)"
        ></app-invoice-search>
      </div>
    }
  </div>
} @else {
  <div class="w-full h-full flex flex-col bg-gradient-to-br from-slate-50 to-slate-100 rounded-lg">
    <!-- Catalog Header with Back Button -->
    <div class="mb-3 md:mb-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 md:gap-0">
      <div>
        <h2 class="text-2xl md:text-3xl font-bold text-slate-800">Catalog Management</h2>
        <p class="text-xs md:text-sm text-slate-500 mt-1">Manage your product catalog and pricing</p>
      </div>
      <button 
        (click)="toggleCatalogManagement()"
        class="flex items-center gap-2 px-3 md:px-4 py-2 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 font-medium transition-all duration-200 text-sm md:text-base"
      >
        <i class="fa-solid fa-arrow-left w-4 md:w-5 h-4 md:h-5" aria-hidden="true"></i>
        Back
      </button>
    </div>
    
    <!-- Catalog Management Component -->
    <div class="flex-1 overflow-hidden">
      <app-catalog-management></app-catalog-management>
    </div>
  </div>
}

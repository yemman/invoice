@if (!showCatalogManagement()) {
  <div class="w-full h-full flex flex-col gap-3 md:gap-6">
    <!-- View Tabs (search disabled) -->
    <div class="flex gap-2 border-b border-slate-200">
      <button
        type="button"
        class="px-4 py-3 transition-colors text-emerald-600 font-semibold"
        aria-selected="true"
      >
        <i class="fa-solid fa-chart-column mr-2"></i>Dashboard Overview
      </button>
    </div>

    <!-- Overview View -->
      <div class="flex-1 overflow-auto space-y-3 md:space-y-6">
        <!-- Cards Grid - Responsive -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-6">
          <app-inventory-sold-card></app-inventory-sold-card>
          <app-accounts-receivable-card (selectCustomer)="selectCustomer($event)" (newInvoice)="manualInvoice.emit()"></app-accounts-receivable-card>
          <app-catalog-card (manage)="toggleCatalogManagement()"></app-catalog-card>
        </div>
        
        <app-customer-invoices
          [customerName]="selectedCustomer()"
          [invoices]="customerInvoices()"
          (close)="clearSelection()"
          (edit)="onEditInvoice($event)"
          (remove)="onDeleteInvoice($event)"
        ></app-customer-invoices>
      </div>

  </div>
} @else {
  <div class="w-full h-full flex flex-col bg-gradient-to-br from-slate-50 to-slate-100 rounded-lg">    
    <!-- Catalog Management Component -->
    <div class="flex-1 overflow-hidden">
      <app-catalog-management (close)="toggleCatalogManagement()"></app-catalog-management>
    </div>
  </div>
}

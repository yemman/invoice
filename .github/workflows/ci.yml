name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests with Firebase Emulator
      run: npx firebase-tools emulators:exec --project demo-crm-test --import=./tests/emulator-data "npm test -- --watch=false --browsers=ChromeHeadless"

    - name: Build project
      run: npm run build

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          npm-cache-${{ runner.os }}-

    - name: Lockfile Integrity Check
      run: |
        npm pkg set scripts.lock-check="npm install --package-lock-only && git diff --exit-code package-lock.json"
        npm run lock-check

    - name: Install dependencies
      run: npm ci

    - name: Rebuild native bindings
      run: npm rebuild

    - name: Run tests with Firebase Emulator
      run: npx firebase-tools emulators:exec --project demo-crm-test --import=./tests/emulator-data "npm test"

    - name: Build project
      run: npm run build
